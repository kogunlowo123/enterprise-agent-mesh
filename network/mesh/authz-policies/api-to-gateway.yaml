apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-to-gateway
  namespace: enterprise-agent-mesh
spec:
  selector:
    matchLabels:
      app: api
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/enterprise-agent-mesh/sa/api"
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/api/v1/*"]
