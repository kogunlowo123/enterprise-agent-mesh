[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "services/api/src",
    "services/agent-runtime/src",
    "services/rag-core/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
