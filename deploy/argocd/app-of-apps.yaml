apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-agent-mesh-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/enterprise-agent-mesh
    targetRevision: HEAD
    path: deploy/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
