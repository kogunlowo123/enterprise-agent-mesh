apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-mesh-secrets
  namespace: enterprise-agent-mesh
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: agent-mesh-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: enterprise-agent-mesh/jwt
        property: secret_key
    - secretKey: database_url
      remoteRef:
        key: enterprise-agent-mesh/database
        property: url
    - secretKey: aws_access_key_id
      remoteRef:
        key: enterprise-agent-mesh/aws
        property: access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: enterprise-agent-mesh/aws
        property: secret_access_key
