apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [enterprise-agent-mesh]
      verifyImages:
        - imageReferences:
            - "ghcr.io/kogunlowo123/enterprise-agent-mesh/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/kogunlowo123/enterprise-agent-mesh/.github/workflows/release.yml@refs/tags/*"
                    issuer: "https://token.actions.githubusercontent.com"
